[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "financebtw-backend"
version = "0.1.0"
description = "FinanceBtw — AI-powered financial research assistant backend"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",

    # Config & validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",

    # Auth (Supabase + JWT)
    "python-jose[cryptography]>=3.3.0",
    "pyjwt[crypto]>=2.9.0",
    "supabase>=2.10.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",

    # Cache
    "redis[asyncio]>=5.2.0",

    # Vector DB
    "qdrant-client>=1.12.0",

    # HTTP client (for provider APIs)
    "httpx>=0.28.0",

    # Logging
    "structlog>=24.4.0",

    # Market data providers
    "yfinance>=0.2.48",
    "nsepython>=2.0",
    "bsedata>=0.5.1",

    # AI Agent Orchestration (LangGraph)
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",

    # Universal LLM Gateway (LiteLLM)
    "litellm>=1.50.0",

    # RAG Framework (LlamaIndex)
    "llama-index>=0.11.0",
    "llama-index-vector-stores-qdrant>=0.2.0",
    "llama-index-embeddings-huggingface>=0.2.0",

    # Local Embeddings & Reranker (BGE-M3, BGE-Reranker-Large)
    "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",       # async test client
    "black>=24.10.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-passlib",
    "types-python-jose",
    "pre-commit>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

# ─── Black ───────────────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py312"]

# ─── Ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "ANN", # flake8-annotations
    "S",   # flake8-bandit (security)
    "RUF", # ruff-specific
]
ignore = [
    "S101",   # use of assert (fine in tests)
    "B008",   # do not perform function call in argument defaults (FastAPI Depends pattern)
    "S106",   # possible hardcoded password
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S"]

# ─── MyPy ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false
exclude = ["tests/", "alembic/"]

# ─── Pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=backend --cov-report=term-missing --cov-fail-under=80 -v"
